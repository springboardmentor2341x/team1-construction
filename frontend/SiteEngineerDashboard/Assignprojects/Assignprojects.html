<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assign Projects - BuildTrack</title>

<link rel="stylesheet" href="assignprojects.css">

</head>

<div id="navbar"></div>
<body>


<div class="project-container">


    <div class="page-header">

        <h1>
            Assign Projects
        </h1>

        <button onclick="openForm()">
            + Assign New Project
        </button>

    </div>




    <div class="project-list">



        <div class="project-card">


            <div class="project-info">

                <h2>
                    Highway Construction Project
                </h2>


                <p>
                    Location : Nashik
                </p>


                <p>
                    Contractor : ABC Construction
                </p>


                <p>
                    Status :
                    <span class="active">
                        Active
                    </span>
                </p>


            </div>



            <button class="view-btn">
                View Details
            </button>


        </div>





        <div class="project-card">


            <div class="project-info">

                <h2>
                    Residential Building Project
                </h2>


                <p>
                    Location : Pune
                </p>


                <p>
                    Contractor : XYZ Builders
                </p>


                <p>
                    Status :
                    <span class="pending">
                        Pending
                    </span>
                </p>


            </div>



            <button class="view-btn">
                View Details
            </button>


        </div>



    </div>





    <div class="assign-form" id="assignForm">


        <h2>
            Assign Project
        </h2>



        <input type="text" id="projectName"
        placeholder="Project Name">



        <input type="text" id="location"
        placeholder="Project Location">



        <input type="text" id="contractor"
        placeholder="Contractor Name">



        <button onclick="assignProject()">
            Assign
        </button>


    </div>



</div>


<script src="../../js/navbar.js"></script>
<script src="assignprojects.js"></script>


</body>

</html>
