<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildTrack | Edit Profile</title>

    <link rel="stylesheet" href="edit.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <header>

        <div class="logo">

            <i class="fa-solid fa-building"></i>
            <h2>BuildTrack</h2>

        </div>

        <a href="profile.html" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>
            Back

        </a>

    </header>

    
    <main class="container">

        <div class="card">

            <h2>
                <i class="fa-solid fa-user-pen"></i>
                Edit Profile
            </h2>

            <form id="profileForm">
                <div class="grid">

                    <div class="input-group">
                        <label>Profile Photo</label>
                        <input type="file" id="photoFile" accept="image/*">
                        <div id="photoPreviewWrapper" style="margin-top:8px;">
                            <img id="photoPreview" src="" alt="Preview" style="width:100px;height:100px;border-radius:50%;object-fit:cover;display:none;">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Enter Full Name" required>
                    </div>

                    <div class="input-group">
                        <label>Role</label>
                        <select id="role">
                            <option>Project Manager</option>
                            <option>Site Engineer</option>
                            <option>Contractor</option>
                            <option>Worker</option>
                            <option>Client</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Employee ID</label>
                        <input type="text" id="employeeId" placeholder="Employee ID">
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter Email" required>
                    </div>

                    <div class="input-group">
                        <label>Mobile</label>
                        <input type="tel" id="phone" placeholder="Mobile Number" required>
                    </div>

                    <div class="input-group">
                        <label>Address</label>
                        <input type="text" id="address" placeholder="Address">
                    </div>

                    <div class="input-group">
                        <label>Role Detail 1</label>
                        <input type="text" id="roleDetail1" placeholder="e.g., Team / Dept">
                    </div>

                    <div class="input-group">
                        <label>Role Detail 2</label>
                        <input type="text" id="roleDetail2" placeholder="Optional">
                    </div>

                </div>

                <div class="buttons">
                    <button type="button" class="cancel" onclick="window.location='profile.html'">Cancel</button>
                    <button type="submit" class="save"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                </div>
            </form>

        </div>

    </main>

    <div id="toast">

        Profile Updated Successfully

    </div>

    <div id="loader">

        <div class="spinner"></div>

    </div>

    <script src="edit.js"></script>

</body>
</html>
