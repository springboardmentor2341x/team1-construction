<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Worker</title>

<link rel="stylesheet" href="add-worker.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="container">



<!-- Sidebar -->

<aside class="sidebar">


<h2>⚙ Admin</h2>


<ul>


<li>

<i class="fa-solid fa-house"></i>

<a href="../../admin-dashboard/admin-dashboard.html">
Dashboard
</a>

</li>



<li>

<i class="fa-solid fa-users"></i>

<a href="../../user-management/user-management.html">
User Management
</a>

</li>



<li class="active">

<i class="fa-solid fa-people-group"></i>

Workforce Management

</li>



<li>

<i class="fa-solid fa-box"></i>

<a href="../../resource-management/resource-management.html">
Resource Management
</a>

</li>



<li>

<i class="fa-solid fa-cubes"></i>

<a href="../../material-management/material-management.html">
Material Management
</a>

</li>



<li>

<i class="fa-solid fa-chart-line"></i>

Reports

</li>



<li>

<i class="fa-solid fa-bell"></i>

Notifications

</li>



<li>

<i class="fa-solid fa-user"></i>

Profile

</li>



<li onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</li>


</ul>


</aside>







<!-- Main Content -->


<main class="main">



<header>


<div>

<h1>
Add New Worker
</h1>


<p>
Register workforce details
</p>


</div>



<a href="../workforce-management.html"
class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>


</header>







<!-- Worker Form -->


<section class="form-card">


<form id="workerForm">



<div class="form-grid">



<div class="form-group">

<label>
Worker ID
</label>

<input type="text"
id="workerId"
placeholder="Enter worker ID">

</div>





<div class="form-group">

<label>
Worker Name
</label>

<input type="text"
id="workerName"
placeholder="Enter worker name">

</div>





<div class="form-group">

<label>
Phone Number
</label>

<input type="text"
id="phone"
placeholder="Enter phone number">

</div>





<div class="form-group">

<label>
Skill Category
</label>


<select id="skill">


<option value="">
Select Skill
</option>


<option>
Mason
</option>


<option>
Electrician
</option>


<option>
Plumber
</option>


<option>
Carpenter
</option>


<option>
Painter
</option>


</select>


</div>







<div class="form-group">

<label>
Experience
</label>


<input type="text"
id="experience"
placeholder="Years of experience">


</div>







<div class="form-group">

<label>
Assigned Project
</label>


<input type="text"
id="project"
placeholder="Enter project name">


</div>







<div class="form-group">

<label>
Joining Date
</label>


<input type="date"
id="joiningDate">


</div>







<div class="form-group">

<label>
Salary
</label>


<input type="number"
id="salary"
placeholder="Enter salary">


</div>







<div class="form-group">

<label>
Availability Status
</label>


<select id="availability">


<option>
Available
</option>


<option>
Assigned
</option>


<option>
Leave
</option>


</select>


</div>



</div>







<div class="buttons">


<button type="submit"
class="save-btn">


<i class="fa-solid fa-user-plus"></i>

Add Worker


</button>





<button type="reset"
class="cancel-btn">

Cancel

</button>


</div>





</form>


</section>




</main>



</div>




<script src="add-worker.js"></script>


</body>

</html>
