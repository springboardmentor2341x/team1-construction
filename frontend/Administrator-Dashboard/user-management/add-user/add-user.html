<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add User</title>

<link rel="stylesheet" href="add-user.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="container">



<!-- Sidebar -->

<aside class="sidebar">


<h2>⚙ Admin</h2>


<ul>


<li>

<i class="fa-solid fa-house"></i>

<a href="../../admin-dashboard/admin-dashboard.html">
Dashboard
</a>

</li>



<li class="active">

<i class="fa-solid fa-users"></i>

User Management

</li>



<li>

<i class="fa-solid fa-people-group"></i>

Workforce Management

</li>



<li>

<i class="fa-solid fa-box"></i>

Resource Management

</li>



<li>

<i class="fa-solid fa-cubes"></i>

Material Management

</li>



<li>

<i class="fa-solid fa-chart-line"></i>

Reports

</li>



<li>

<i class="fa-solid fa-bell"></i>

Notifications

</li>



<li>

<i class="fa-solid fa-user"></i>

Profile

</li>



<li onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</li>


</ul>


</aside>






<!-- Main Content -->


<main class="main">



<header>


<div>

<h1>Add New User</h1>

<p>Create a new user account</p>

</div>



<a href="../user-management.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>


</header>







<!-- Add User Form -->


<section class="form-card">


<form id="userForm">



<div class="form-grid">



<div class="form-group">

<label>
Full Name
</label>

<input type="text"
id="name"
placeholder="Enter full name">

</div>





<div class="form-group">

<label>
Email
</label>

<input type="email"
id="email"
placeholder="Enter email">

</div>





<div class="form-group">

<label>
Phone Number
</label>

<input type="text"
id="phone"
placeholder="Enter phone number">

</div>





<div class="form-group">

<label>
Role
</label>


<select id="role">


<option value="">
Select Role
</option>


<option>
Project Manager
</option>


<option>
Site Engineer
</option>


<option>
Contractor
</option>


<option>
Worker
</option>


<option>
Client
</option>


</select>


</div>






<div class="form-group">

<label>
Username
</label>

<input type="text"
id="username"
placeholder="Enter username">

</div>






<div class="form-group">

<label>
Password
</label>

<input type="password"
id="password"
placeholder="Enter password">

</div>






<div class="form-group">

<label>
Confirm Password
</label>

<input type="password"
id="confirmPassword"
placeholder="Confirm password">

</div>






<div class="form-group">

<label>
Status
</label>


<select id="status">


<option>
Active
</option>


<option>
Inactive
</option>


</select>


</div>



</div>





<div class="buttons">


<button type="submit" class="save-btn">

<i class="fa-solid fa-user-plus"></i>

Add User

</button>




<button type="reset" class="cancel-btn">

Cancel

</button>


</div>



</form>



</section>




</main>



</div>



<script src="add-user.js"></script>


</body>

</html>
