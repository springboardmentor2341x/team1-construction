<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Resource</title>

<link rel="stylesheet" href="add-resource.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="container">



<!-- Sidebar -->

<aside class="sidebar">


<h2>⚙ Admin</h2>


<ul>


<li>

<i class="fa-solid fa-house"></i>

<a href="../../admin-dashboard/admin-dashboard.html">
Dashboard
</a>

</li>




<li>

<i class="fa-solid fa-users"></i>

<a href="../../user-management/user-management.html">
User Management
</a>

</li>




<li>

<i class="fa-solid fa-people-group"></i>

<a href="../../workforce-management/workforce-management.html">
Workforce Management
</a>

</li>




<li class="active">

<i class="fa-solid fa-box"></i>

Resource Management

</li>




<li>

<i class="fa-solid fa-cubes"></i>

<a href="../../material-management/material-management.html">
Material Management
</a>

</li>




<li>

<i class="fa-solid fa-chart-line"></i>

Reports

</li>




<li>

<i class="fa-solid fa-bell"></i>

Notifications

</li>




<li>

<i class="fa-solid fa-user"></i>

Profile

</li>




<li onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</li>



</ul>


</aside>







<!-- Main Content -->


<main class="main">



<header>


<div>

<h1>
Add New Resource
</h1>

<p>
Register project resources and equipment details
</p>


</div>




<a href="../resource-management.html"
class="back-btn">


<i class="fa-solid fa-arrow-left"></i>

Back


</a>



</header>







<!-- Resource Form -->


<section class="form-card">


<form id="resourceForm">



<div class="form-grid">





<div class="form-group">

<label>
Resource ID
</label>

<input type="text"
id="resourceId"
placeholder="Enter resource ID">

</div>






<div class="form-group">

<label>
Resource Name
</label>


<input type="text"
id="resourceName"
placeholder="Enter resource name">


</div>







<div class="form-group">

<label>
Resource Type
</label>


<select id="resourceType">


<option value="">
Select Type
</option>


<option>
Equipment
</option>


<option>
Vehicle
</option>


<option>
Tool
</option>


<option>
Machinery
</option>


</select>


</div>







<div class="form-group">

<label>
Quantity
</label>


<input type="number"
id="quantity"
placeholder="Enter quantity">


</div>







<div class="form-group">

<label>
Availability Status
</label>


<select id="availability">


<option>
Available
</option>


<option>
Assigned
</option>


<option>
Maintenance
</option>


</select>


</div>







<div class="form-group">

<label>
Assigned Project
</label>


<input type="text"
id="project"
placeholder="Enter project name">


</div>







<div class="form-group">

<label>
Purchase Date
</label>


<input type="date"
id="purchaseDate">


</div>







<div class="form-group">

<label>
Condition
</label>


<select id="condition">


<option>
New
</option>


<option>
Good
</option>


<option>
Needs Repair
</option>


<option>
Damaged
</option>


</select>


</div>





</div>








<div class="buttons">



<button type="submit"
class="save-btn">


<i class="fa-solid fa-plus"></i>

Add Resource


</button>





<button type="reset"
class="cancel-btn">

Cancel

</button>



</div>





</form>


</section>




</main>



</div>



<script src="add-resource.js"></script>


</body>

</html>
