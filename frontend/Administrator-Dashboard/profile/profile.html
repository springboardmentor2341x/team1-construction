<!-- Main -->


<main class="main">


<header>

<h1>Admin Profile</h1>


<div class="welcome">
Welcome, Admin 👋
</div>


</header>





<!-- Profile Card -->


<section class="profile-card">


<div class="profile-image">

<i class="fa-solid fa-user"></i>

</div>


<h2>Admin Name</h2>

<p>
System Administrator
</p>


<button id="editBtn">
Edit Profile
</button>


</section>






<!-- Personal Details -->


<section class="details-card">


<h2>Personal Information</h2>


<div class="details-grid">


<div>

<label>Name</label>

<input type="text"
value="John Smith"
readonly>

</div>



<div>

<label>Email</label>

<input type="email"
value="admin@gmail.com"
readonly>

</div>



<div>

<label>Phone</label>

<input type="text"
value="+91 9876543210"
readonly>

</div>



<div>

<label>Role</label>

<input type="text"
value="Administrator"
readonly>

</div>



<div>

<label>Department</label>

<input type="text"
value="Management"
readonly>

</div>



<div>

<label>Joining Date</label>

<input type="text"
value="01-Jan-2026"
readonly>

</div>



</div>


</section>







<!-- Security -->


<section class="security-card">


<h2>
Security Settings
</h2>


<button id="passwordBtn">

Change Password

</button>


</section>





</main>
