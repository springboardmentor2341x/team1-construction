<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile | BuildTrack</title>

<link rel="stylesheet" href="edit.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>


<body>


<div class="container">


<!-- Sidebar -->

<aside class="sidebar">


<div class="logo">

<h2>BuildTrack</h2>

<p>Worker</p>

</div>


<ul>


<li>

<a href="../Profile.html">

<i class="fa-solid fa-user"></i>

Profile

</a>

</li>


<li>

<a href="../../workerdashboard/workerdashboard.html">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

</li>


<li>

<a href="../../login/login.html">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</li>


</ul>


</aside>



<!-- Main Content -->


<main class="main-content">


<div class="header">

<h1>Edit Profile</h1>

<p>Update your personal details.</p>

</div>



<div class="edit-card">


<h2>Personal Information</h2>



<form id="profileForm">


<div class="row">


<div class="input-box">

<label>Full Name</label>

<input type="text" value="Rahul Sharma">

</div>



<div class="input-box">

<label>Employee ID</label>

<input type="text" value="EMP1025" readonly>

</div>


</div>




<div class="row">


<div class="input-box">

<label>Email Address</label>

<input type="email" value="rahul@gmail.com">

</div>



<div class="input-box">

<label>Mobile Number</label>

<input type="text" value="9876543210">

</div>


</div>




<div class="row">


<div class="input-box">

<label>Department</label>

<select>

<option>Construction</option>

<option>Electrical</option>

<option>Plumbing</option>

<option>Safety</option>

</select>


</div>



<div class="input-box">

<label>Role</label>

<input type="text" value="Worker" readonly>

</div>


</div>




<div class="input-box">


<label>Address</label>

<textarea rows="4">
Pune, Maharashtra, India
</textarea>


</div>




<div class="button-group">


<a href="../Profile.html" class="cancel-btn">

Cancel

</a>



<button type="submit" class="save-btn">

Save Changes

</button>


</div>


</form>


</div>



</main>


</div>



<script src="edit.js"></script>


</body>

</html>
