<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Schedule | BuildTrack</title>

<link rel="stylesheet" href="projectschedule.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<div class="container">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">

<h2>BuildTrack</h2>

<p>Administrator</p>

</div>

<ul>

<li><a href="projectcreation.html"><i class="fa-solid fa-folder-plus"></i>Create Project</a></li>

<li><a href="projectlist.html"><i class="fa-solid fa-list"></i>Project List</a></li>

<li><a href="projectdetails.html"><i class="fa-solid fa-folder-open"></i>Project Details</a></li>

<li><a href="projectupdate.html"><i class="fa-solid fa-pen"></i>Update Project</a></li>

<li class="active"><a href="projectschedule.html"><i class="fa-solid fa-calendar-days"></i>Project Schedule</a></li>

<li><a href="milestonemanagement.html"><i class="fa-solid fa-flag-checkered"></i>Milestones</a></li>

<li><a href="projectstatus.html"><i class="fa-solid fa-chart-line"></i>Project Status</a></li>

</ul>

</aside>

<!-- Main -->

<main class="main-content">

<div class="header">

<h1>Project Scheduling</h1>

<p>Plan project phases, timelines and assignments.</p>

</div>

<div class="form-container">

<form id="scheduleForm">

<div class="row">

<div class="input-box">

<label>Project Name</label>

<input type="text" placeholder="Apartment Tower">

</div>

<div class="input-box">

<label>Project Manager</label>

<select>

<option>Select Manager</option>
<option>Rahul Sharma</option>
<option>Priya Patil</option>
<option>Amit Verma</option>

</select>

</div>

</div>

<div class="row">

<div class="input-box">

<label>Project Phase</label>

<select>

<option>Foundation</option>
<option>Structural Work</option>
<option>Electrical</option>
<option>Plumbing</option>
<option>Finishing</option>

</select>

</div>

<div class="input-box">

<label>Activity Name</label>

<input type="text" placeholder="Enter Activity">

</div>

</div>

<div class="row">

<div class="input-box">

<label>Start Date</label>

<input type="date">

</div>

<div class="input-box">

<label>End Date</label>

<input type="date">

</div>

</div>

<div class="row">

<div class="input-box">

<label>Duration (Days)</label>

<input type="number" placeholder="30">

</div>

<div class="input-box">

<label>Status</label>

<select>

<option>Planning</option>
<option>In Progress</option>
<option>Completed</option>

</select>

</div>

</div>

<div class="row">

<div class="input-box">

<label>Assign Site Engineer</label>

<select>

<option>Select Site Engineer</option>
<option>Rohan Patil</option>
<option>Sneha Joshi</option>

</select>

</div>

<div class="input-box">

<label>Assign Contractor</label>

<select>

<option>Select Contractor</option>
<option>ABC Construction</option>
<option>XYZ Builders</option>

</select>

</div>

</div>

<div class="input-box">

<label>Remarks</label>

<textarea rows="5" placeholder="Additional scheduling remarks..."></textarea>

</div>

<div class="button-group">

<button type="reset" class="reset-btn">

Reset

</button>

<button type="submit" class="save-btn">

Save Schedule

</button>

</div>

</form>

</div>

</main>

</div>

<script src="projectschedule.js"></script>

</body>

</html>
