<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Update Project | BuildTrack</title>

<link rel="stylesheet" href="projectupdate.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<div class="container">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">

<h2>BuildTrack</h2>

<p>Administrator</p>

</div>

<ul>

<li><a href="projectcreation.html"><i class="fa-solid fa-folder-plus"></i>Create Project</a></li>

<li><a href="projectlist.html"><i class="fa-solid fa-list"></i>Project List</a></li>

<li><a href="projectdetails.html"><i class="fa-solid fa-folder-open"></i>Project Details</a></li>

<li class="active"><a href="projectupdate.html"><i class="fa-solid fa-pen"></i>Update Project</a></li>

<li><a href="projectschedule.html"><i class="fa-solid fa-calendar-days"></i>Project Schedule</a></li>

<li><a href="milestonemanagement.html"><i class="fa-solid fa-flag-checkered"></i>Milestones</a></li>

<li><a href="projectstatus.html"><i class="fa-solid fa-chart-line"></i>Project Status</a></li>

</ul>

</aside>

<!-- Main -->

<main class="main-content">

<div class="header">

<h1>Update Project</h1>

<p>Modify existing project information.</p>

</div>

<div class="form-container">

<form id="updateProjectForm">

<div class="row">

<div class="input-box">

<label>Project Name</label>

<input type="text" value="Apartment Tower">

</div>

<div class="input-box">

<label>Project Code</label>

<input type="text" value="BT001" readonly>

</div>

</div>

<div class="row">

<div class="input-box">

<label>Project Category</label>

<select>

<option selected>Residential</option>

<option>Commercial</option>

<option>Industrial</option>

<option>Infrastructure</option>

</select>

</div>

<div class="input-box">

<label>Client Name</label>

<input type="text" value="ABC Developers">

</div>

</div>

<div class="row">

<div class="input-box">

<label>Estimated Budget</label>

<input type="number" value="850000">

</div>

<div class="input-box">

<label>Project Location</label>

<input type="text" value="Pune">

</div>

</div>

<div class="row">

<div class="input-box">

<label>Start Date</label>

<input type="date">

</div>

<div class="input-box">

<label>Expected Completion</label>

<input type="date">

</div>

</div>

<div class="row">

<div class="input-box">

<label>Status</label>

<select>

<option>Planning</option>

<option selected>In Progress</option>

<option>On Hold</option>

<option>Completed</option>

</select>

</div>

<div class="input-box">

<label>Priority</label>

<select>

<option>Low</option>

<option selected>High</option>

<option>Medium</option>

</select>

</div>

</div>

<div class="input-box">

<label>Assign Project Manager</label>

<select>

<option selected>Rahul Sharma</option>

<option>Priya Patil</option>

<option>Amit Verma</option>

</select>

</div>

<div class="input-box">

<label>Project Description</label>

<textarea rows="5">

Modern residential apartment construction project.

</textarea>

</div>

<div class="button-group">

<button type="reset" class="reset-btn">

Reset

</button>

<button type="submit" class="save-btn">

Update Project

</button>

</div>

</form>

</div>

</main>

</div>

<script src="projectupdate.js"></script>

</body>

</html>
