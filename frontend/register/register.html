<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registration</title>

    <link rel="stylesheet" href="register.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <!-- LEFT SECTION -->

      <div class="left">
        <div class="overlay">
          <h1>BuildTrack</h1>
          
          <h2>Construction Project Management</h2>

          <p>
            Manage Projects, Workforce, Materials and Budgets from one secure
            platform.
          </p>

          <div class="info-box">
            <div class="box">
              <i class="fa-solid fa-building"></i>
              <span>Projects</span>
            </div>

            <div class="box">
              <i class="fa-solid fa-users"></i>
              <span>Employees</span>
            </div>

            <div class="box">
              <i class="fa-solid fa-chart-line"></i>
              <span>Analytics</span>
            </div>

            <div class="box">
              <i class="fa-solid fa-user-shield"></i>
              <span>Secure Access</span>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT SECTION -->

      <div class="right">
        <div class="card">
          <h2>Create Account</h2>

          <p>Register to continue</p>

          <form id="registerForm">
            <div class="row">
              <div class="input-group">
                <label>Full Name</label>

                <div class="input-box">
                  <i class="fa fa-user"></i>

                  <input type="text" id="fullname" placeholder="Full Name" />
                </div>

                <small id="fullnameError"></small>
              </div>

              <div class="input-group">
                <label>Employee ID</label>

                <div class="input-box">
                  <i class="fa fa-id-card"></i>

                  <input
                    type="text"
                    id="employeeId"
                    placeholder="Employee ID"
                  />
                </div>

                <small id="employeeIdError"></small>
              </div>
            </div>

            <div class="row">
              <div class="input-group">
                <label>Email</label>

                <div class="input-box">
                  <i class="fa fa-envelope"></i>

                  <input type="email" id="email" placeholder="Email Address" />
                </div>

                <small id="emailError"></small>
              </div>

              <div class="input-group">
                <label>Mobile</label>

                <div class="input-box">
                  <i class="fa fa-phone"></i>

                  <input type="text" id="mobile" placeholder="Mobile Number" />
                </div>

                <small id="mobileError"></small>
              </div>
            </div>

            <div class="row">
              <div class="input-group">
                <label>Department</label>

                <div class="input-box">
                  <i class="fa fa-building"></i>

                  <input type="text" id="department" placeholder="Department" />
                </div>

                <small id="departmentError"></small>
              </div>

              <div class="input-group">
                <label>Role</label>

                <div class="input-box">
                  <i class="fa fa-user-tag"></i>

                  <select id="role">
                    <option value="">Select Role</option>

                    <option>Administrator</option>
                    <option>Project Manager</option>
                    <option>Site Engineer</option>
                    <option>Contractor</option>
                    <option>Worker</option>
                    <option>Client</option>
                  </select>
                </div>

                <small id="roleError"></small>
              </div>
            </div>

            <div class="row">
              <div class="input-group">
                <label>Password</label>

                <div class="input-box">
                  <i class="fa fa-lock"></i>

                  <input type="password" id="password" placeholder="Password" />

                  <i
                    class="fa-solid fa-eye togglePassword"
                    id="togglePassword"
                  ></i>
                </div>

                <small id="passwordError"></small>
              </div>

              <div class="input-group">
                <label>Confirm Password</label>

                <div class="input-box">
                  <i class="fa fa-lock"></i>

                  <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                  />
                </div>

                <small id="confirmPasswordError"></small>
              </div>
            </div>

            <div class="input-group">
              <label>Address</label>

              <textarea
                id="address"
                rows="3"
                placeholder="Enter Address"
              ></textarea>

              <small id="addressError"></small>
            </div>

            <div class="input-group">
              <label>Profile Picture</label>

              <input type="file" id="profileImage" accept="image/*" />

              <img
                id="previewImage"
                src=""
                style="
                  display: none;
                  width: 90px;
                  height: 90px;
                  border-radius: 50%;
                  margin-top: 15px;
                  object-fit: cover;
                "
              />
            </div>

            <button>
              <i class="fa fa-user-plus"></i>

              Create Account
            </button>

            <div class="bottom">
              Already have an account?

              <a href="../login/login.html"> Login </a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="register.js"></script>
  </body>
</html>
