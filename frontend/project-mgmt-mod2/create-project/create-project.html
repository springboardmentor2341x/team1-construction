<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project</title>
    <link rel="stylesheet" href="create-project.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>Create New Project</h1>
            <p>Enter the project details to create a new construction project.</p>
        </div>

        <!-- Project Form -->
        <div class="form-container">
            <form id="projectForm">

                <div class="form-grid">

                    <!-- Project ID -->
                    <div class="form-group">
                        <label for="projectId">Project ID</label>
                        <input type="text" id="projectId" placeholder="PRJ001">
                        <small class="error" id="projectIdError"></small>
                    </div>

                    <!-- Project Name -->
                    <div class="form-group">
                        <label for="projectName">Project Name</label>
                        <input type="text" id="projectName" placeholder="Skyline Apartments">
                        <small class="error" id="projectNameError"></small>
                    </div>

                    <!-- Client Name -->
                    <div class="form-group">
                        <label for="clientName">Client Name</label>
                        <input type="text" id="clientName" placeholder="ABC Constructions">
                        <small class="error" id="clientNameError"></small>
                    </div>

                    <!-- Project Manager -->
                    <div class="form-group">
                        <label for="projectManager">Project Manager</label>
                        <select id="projectManager">
                            <option value="">Select Manager</option>
                            <option>John Smith</option>
                            <option>David Johnson</option>
                            <option>Emily Brown</option>
                            <option>Michael Lee</option>
                        </select>
                        <small class="error" id="projectManagerError"></small>
                    </div>

                    <!-- Start Date -->
                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate">
                        <small class="error" id="startDateError"></small>
                    </div>

                    <!-- End Date -->
                    <div class="form-group">
                        <label for="endDate">Expected End Date</label>
                        <input type="date" id="endDate">
                        <small class="error" id="endDateError"></small>
                    </div>

                    <!-- Budget -->
                    <div class="form-group">
                        <label for="budget">Budget (₹)</label>
                        <input type="number" id="budget" placeholder="5000000">
                        <small class="error" id="budgetError"></small>
                    </div>

                    <!-- Status -->
                    <div class="form-group">
                        <label for="status">Project Status</label>
                        <select id="status">
                            <option value="">Select Status</option>
                            <option>Planning</option>
                            <option>In Progress</option>
                            <option>On Hold</option>
                            <option>Completed</option>
                        </select>
                        <small class="error" id="statusError"></small>
                    </div>

                    <!-- Priority -->
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority">
                            <option value="">Select Priority</option>
                            <option>High</option>
                            <option>Medium</option>
                            <option>Low</option>
                        </select>
                        <small class="error" id="priorityError"></small>
                    </div>

                    <!-- Location -->
                    <div class="form-group">
                        <label for="location">Project Location</label>
                        <input type="text" id="location" placeholder="Hyderabad">
                        <small class="error" id="locationError"></small>
                    </div>

                </div>

                <!-- Description -->
                <div class="form-group description">
                    <label for="description">Project Description</label>
                    <textarea id="description" rows="5" placeholder="Enter project description..."></textarea>
                    <small class="error" id="descriptionError"></small>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="reset" class="reset-btn">
                        <i class="fa-solid fa-rotate-left"></i> Reset
                    </button>

                    <button type="submit" class="submit-btn">
                        <i class="fa-solid fa-plus"></i> Create Project
                    </button>
                </div>

            </form>
        </div>

    </div>

    <script src="create-project.js"></script>

</body>
</html>
