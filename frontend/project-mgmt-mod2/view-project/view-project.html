<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Project</title>

    <link rel="stylesheet" href="view-project.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <div>
            <h1>Project Details</h1>
            <p>View complete information about the selected project.</p>
        </div>

        <a href="../project-list/project-list.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </a>

    </div>

    <!-- Project Details Card -->

    <div class="details-card">

        <div class="details-grid">

            <div class="detail-box">
                <label>Project ID</label>
                <input type="text" value="PRJ001" readonly>
            </div>

            <div class="detail-box">
                <label>Project Name</label>
                <input type="text" value="Skyline Apartments" readonly>
            </div>

            <div class="detail-box">
                <label>Client Name</label>
                <input type="text" value="ABC Constructions" readonly>
            </div>

            <div class="detail-box">
                <label>Project Manager</label>
                <input type="text" value="John Smith" readonly>
            </div>

            <div class="detail-box">
                <label>Start Date</label>
                <input type="text" value="01-Jul-2026" readonly>
            </div>

            <div class="detail-box">
                <label>Expected End Date</label>
                <input type="text" value="30-Dec-2026" readonly>
            </div>

            <div class="detail-box">
                <label>Budget</label>
                <input type="text" value="₹50,00,000" readonly>
            </div>

            <div class="detail-box">
                <label>Status</label>
                <input type="text" value="In Progress" readonly>
            </div>

            <div class="detail-box">
                <label>Priority</label>
                <input type="text" value="High" readonly>
            </div>

            <div class="detail-box">
                <label>Location</label>
                <input type="text" value="Hyderabad" readonly>
            </div>

        </div>

        <!-- Description -->

        <div class="description">

            <label>Project Description</label>

            <textarea readonly>
Construction of a 12-floor residential apartment with parking, clubhouse, landscaped gardens, and modern amenities.
            </textarea>

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <a href="../project-list/project-list.html" class="cancel-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back to List
            </a>

            <a href="../edit-project/edit-project.html" class="edit-btn">
                <i class="fa-solid fa-pen"></i>
                Edit Project
            </a>

        </div>

    </div>

</div>

<script src="view-project.js"></script>

</body>
</html>
