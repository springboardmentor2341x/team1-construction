<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project</title>

    <link rel="stylesheet" href="edit-project.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <div>
            <h1>Edit Project</h1>
            <p>Update the project information.</p>
        </div>

        <a href="../project-list/project-list.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </a>

    </div>

    <!-- Form Card -->

    <div class="form-container">

        <form id="editProjectForm">

            <div class="form-grid">

                <!-- Project ID -->

                <div class="form-group">

                    <label>Project ID</label>

                    <input
                    type="text"
                    id="projectId"
                    value="PRJ001"
                    readonly>

                </div>

                <!-- Project Name -->

                <div class="form-group">

                    <label>Project Name</label>

                    <input
                    type="text"
                    id="projectName"
                    value="Skyline Apartments">

                    <small class="error" id="projectNameError"></small>

                </div>

                <!-- Client Name -->

                <div class="form-group">

                    <label>Client Name</label>

                    <input
                    type="text"
                    id="clientName"
                    value="ABC Constructions">

                    <small class="error" id="clientNameError"></small>

                </div>

                <!-- Project Manager -->

                <div class="form-group">

                    <label>Project Manager</label>

                    <select id="projectManager">

                        <option>John Smith</option>
                        <option>Emily Brown</option>
                        <option>David Johnson</option>
                        <option>Michael Lee</option>

                    </select>

                </div>

                <!-- Start Date -->

                <div class="form-group">

                    <label>Start Date</label>

                    <input
                    type="date"
                    id="startDate"
                    value="2026-07-01">

                </div>

                <!-- End Date -->

                <div class="form-group">

                    <label>Expected End Date</label>

                    <input
                    type="date"
                    id="endDate"
                    value="2026-12-30">

                </div>

                <!-- Budget -->

                <div class="form-group">

                    <label>Budget (₹)</label>

                    <input
                    type="number"
                    id="budget"
                    value="5000000">

                    <small class="error" id="budgetError"></small>

                </div>

                <!-- Status -->

                <div class="form-group">

                    <label>Status</label>

                    <select id="status">

                        <option>Planning</option>
                        <option selected>In Progress</option>
                        <option>Completed</option>
                        <option>On Hold</option>

                    </select>

                </div>

                <!-- Priority -->

                <div class="form-group">

                    <label>Priority</label>

                    <select id="priority">

                        <option selected>High</option>
                        <option>Medium</option>
                        <option>Low</option>

                    </select>

                </div>

                <!-- Location -->

                <div class="form-group">

                    <label>Location</label>

                    <input
                    type="text"
                    id="location"
                    value="Hyderabad">

                </div>

            </div>

            <!-- Description -->

            <div class="form-group description">

                <label>Project Description</label>

                <textarea id="description" rows="5">
Construction of a 12-floor residential apartment with parking, clubhouse and modern amenities.
                </textarea>

            </div>

            <!-- Buttons -->

            <div class="button-group">

                <a href="../project-list/project-list.html" class="cancel-btn">
                    <i class="fa-solid fa-xmark"></i>
                    Cancel
                </a>

                <button type="submit" class="update-btn">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Update Project
                </button>

            </div>

        </form>

    </div>

</div>

<script src="edit-project.js"></script>

</body>
</html>
