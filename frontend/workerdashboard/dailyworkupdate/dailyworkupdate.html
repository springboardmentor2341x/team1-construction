<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Work Update - BuildTrack</title>

<link rel="stylesheet" href="dailyworkupdate.css">

</head>


<body>

<div id="navbar"></div>
<div class="work-container">



    <div class="page-header">

        <h1>
            Daily Work Update
        </h1>


        <p>
            Submit your daily construction progress
        </p>


    </div>





    <div class="update-card">



        <form id="workForm">



            <div class="input-group">


                <label>
                    Project Name
                </label>


                <input type="text" 
                id="project"
                placeholder="Enter project name">


            </div>





            <div class="input-group">


                <label>
                    Work Date
                </label>


                <input type="date" 
                id="date">


            </div>






            <div class="input-group">


                <label>
                    Work Description
                </label>


                <textarea 
                id="description"
                placeholder="Describe today's work">
                </textarea>


            </div>







            <div class="input-group">


                <label>
                    Work Status
                </label>



                <select id="status">


                    <option>
                        Completed
                    </option>


                    <option>
                        In Progress
                    </option>


                    <option>
                        Pending
                    </option>


                </select>



            </div>






            <div class="input-group">


                <label>
                    Upload Work Image
                </label>


                <input type="file" 
                id="workImage">


            </div>







            <button type="submit">

                Submit Update

            </button>



        </form>



    </div>






    <div class="history-section">


        <h2>
            Previous Updates
        </h2>




        <div class="history-card">


            <h3>
                Building Construction
            </h3>


            <p>
                Concrete work completed.
            </p>


            <span>
                Status : Completed
            </span>



        </div>





    </div>





</div>



<script src="../../js/navbar.js"></script>
<script src="dailyworkupdate.js"></script>


</body>

</html>
